<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pegue a Bandeira - Versão 2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5f7;color:#17324d}header{background:#17324d;color:white;padding:14px 20px;display:flex;justify-content:space-between}main{max-width:1100px;margin:18px auto;padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border-radius:16px;padding:17px;box-shadow:0 5px 18px #0001}h1,h2{margin:0 0 10px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}.levels button{padding:8px;border:0;border-radius:8px}.levels .active{outline:3px solid #2d9cdb}.levels .done{background:#dff4e6}#grid{display:grid;gap:4px;justify-content:center;background:#dceef2;padding:10px;border-radius:12px}.cell{width:52px;height:52px;background:#f7fbfc;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:25px}.wall{background:#78909c!important}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:#2d9cdb;color:white}.danger{background:#f2d7d5}.block{padding:10px;border-radius:8px;color:white;font-weight:bold;cursor:grab;margin:4px;display:inline-block}.advance{background:#2d9cdb}.right{background:#27ae60}.left{background:#9b51e0}#program{min-height:130px;border:2px dashed #b8cbd2;border-radius:11px;padding:8px;margin-top:8px}.placeholder{text-align:center;color:#78909c;padding:45px 5px}.info{background:#fff7d6;border-radius:10px;padding:10px;margin-top:10px}.status{text-align:center;font-weight:bold;min-height:24px;margin-top:10px}@media(max-width:800px){main{grid-template-columns:1fr}.cell{width:44px;height:44px}}
</style></head>
<body><header><h1>🚩Pegue a Bandeira🚩 CEM Presidente Médici</h1><b>Versão 2 · 10 fases</b></header>
<main><section class="card"><h2 id="title"></h2><div id="goal"></div><div class="levels" id="levels"></div><div id="grid"></div>
<div class="controls"><button class="primary" onclick="run()">▶ Executar</button><button onclick="reset()">↺ Reiniciar</button><button class="danger" onclick="clearProg()">🗑 Limpar</button></div><div class="status" id="status"></div></section>
<section class="card"><h2>🧩 Comandos</h2><div id="blocks"><span class="block advance" draggable="true" data-c="A">⬆ AVANCE</span><span class="block right" draggable="true" data-c="D">↪ DIREITA</span><span class="block left" draggable="true" data-c="E">↩ ESQUERDA</span></div><h2 style="margin-top:16px">💻 Meu programa</h2><div id="program"><div class="placeholder">Arraste os comandos para cá.</div></div><div class="info" id="hint"></div></section></main>
<script>
const L=[["Primeiro passo",6,5,[2,0,1],[1,3],[],"Comece avançando. Você já está olhando para a direita. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["A primeira curva",6,5,[4,0,1],[2,2],[],"Você precisará mudar de direção. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Desvio",7,5,[4,0,1],[2,4],[[3,2],[3,3],[3,4]],"Desvie das árvores. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Labirinto",7,6,[5,0,1],[3,2],[[4,1],[4,2],[2,1],[2,2],[2,3],[2,4],[4,4],[4,5]],"Observe o mapa antes de programar. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Caminho estreito",8,6,[5,0,1],[2,4],[[4,1],[3,1],[2,1],[1,1],[1,2],[1,3],[3,3],[4,3],[5,3],[5,4],[5,5],[3,5],[2,5],[1,5],[1,6]],"Planeje vários passos. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Volta na floresta",8,7,[6,0,1],[3,5],[[5,1],[4,1],[3,1],[3,2],[3,3],[5,3],[5,4],[5,5],[2,5],[2,6],[4,6],[5,6]],"Faça curvas e contorne os obstáculos. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["O corredor",9,7,[6,0,1],[4,4],[[5,1],[4,1],[3,1],[1,1],[1,2],[1,3],[5,3],[5,4],[5,5],[1,5],[2,5],[3,5],[3,6],[3,7],[5,7],[6,7]],"Use as curvas para mudar de corredor. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Grande floresta",9,8,[7,0,1],[3,3],[[6,1],[5,1],[4,1],[2,1],[2,2],[2,3],[4,3],[5,3],[6,3],[6,4],[6,5],[3,5],[2,5],[1,5],[1,6],[1,7],[3,7],[4,7],[5,7],[6,7]],"Planeje, teste e corrija. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["Desafio lógico",10,8,[7,0,1],[4,5],[[6,1],[5,1],[4,1],[4,2],[2,2],[2,3],[2,4],[4,4],[5,4],[6,4],[6,5],[6,6],[3,6],[2,6],[1,6],[1,7],[1,8],[3,8],[4,8],[5,8],[6,8]],"Pense como um programador. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."],["🏆 Mestre da Bandeira",10,9,[8,0,1],[3,6],[[7,1],[6,1],[5,1],[3,1],[3,2],[3,3],[5,3],[6,3],[7,3],[7,4],[7,5],[4,5],[3,5],[2,5],[2,6],[2,7],[4,7],[5,7],[6,7],[7,7],[7,8]],"Última fase! Planeje toda a rota. A bandeira pode aparecer até no meio do mapa. Observe a posição antes de programar."]];let n=0,p={},busy=false,done=new Set(),grid=document.querySelector("#grid"),prog=document.querySelector("#program"),status=document.querySelector("#status");
function load(i){n=i;let x=L[n];p={r:x[3][0],c:x[3][1],d:x[3][2]};document.querySelector("#title").textContent="Fase "+(n+1)+" — "+x[0];document.querySelector("#goal").textContent=x[6];document.querySelector("#hint").textContent="💡 "+x[6];grid.style.gridTemplateColumns="repeat("+x[1]+",52px)";draw();levels();clearProg()}
function levels(){let z=document.querySelector("#levels");z.innerHTML="";L.forEach((x,i)=>{let b=document.createElement("button");b.textContent=(done.has(i)?"⭐ ":"")+(i+1);b.className=(i==n?"active ":"")+(done.has(i)?"done":"");b.onclick=()=>!busy&&load(i);z.appendChild(b)})}
function draw(){let x=L[n];grid.innerHTML="";for(let r=0;r<x[2];r++)for(let c=0;c<x[1];c++){let q=document.createElement("div");q.className="cell";let wall=x[5].some(w=>w[0]==r&&w[1]==c);if(wall){q.classList.add("wall");q.textContent="🪨"}else if(r==p.r&&c==p.c)q.textContent=["🔼","▶️","🔽","◀️"][p.d];else if(r==x[4][0]&&c==x[4][1])q.textContent="🏁";else q.textContent="🌿";grid.appendChild(q)}}
document.querySelectorAll(".block").forEach(b=>b.ondragstart=e=>e.dataTransfer.setData("c",b.dataset.c));
prog.ondragover=e=>e.preventDefault();prog.ondrop=e=>{e.preventDefault();let c=e.dataTransfer.getData("c");if(!c)return;let b=document.createElement("span");b.className="block "+(c=="A"?"advance":c=="D"?"right":"left");b.dataset.c=c;b.textContent=c=="A"?"⬆ AVANCE":c=="D"?"↪ DIREITA":"↩ ESQUERDA";b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData("c",c);prog.querySelector(".placeholder")?.remove();prog.appendChild(b)};
function clearProg(){prog.innerHTML='<div class="placeholder">Arraste os comandos para cá.</div>';status.textContent=""}
function reset(){if(busy)return;let x=L[n];p={r:x[3][0],c:x[3][1],d:x[3][2]};draw();status.textContent=""}
async function run(){if(busy)return;let a=[...prog.querySelectorAll(".block")].map(x=>x.dataset.c);if(!a.length){status.textContent="⚠️ Adicione comandos primeiro.";return}busy=true;reset();status.textContent="🤖 Executando...";let x=L[n];for(let c of a){await new Promise(r=>setTimeout(r,260));if(c=="D")p.d=(p.d+1)%4;if(c=="E")p.d=(p.d+3)%4;if(c=="A"){let dr=[-1,0,1,0][p.d],dc=[0,1,0,-1][p.d],nr=p.r+dr,nc=p.c+dc,wall=nr<0||nr>=x[2]||nc<0||nc>=x[1]||x[5].some(w=>w[0]==nr&&w[1]==nc);if(wall){draw();status.textContent="💥 Obstáculo! Tente outro caminho.";busy=false;return}p.r=nr;p.c=nc}draw();if(p.r==x[4][0]&&p.c==x[4][1]){done.add(n);levels();status.textContent="🎉 Fase concluída!";busy=false;if(n<9)setTimeout(()=>load(n+1),850);else setTimeout(()=>status.textContent="🏆 Você completou as 10 fases!",850);return}}status.textContent="🤔 Não chegou à bandeira. Ajuste o programa.";busy=false}
load(0);
</script></body></html>
